<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="16" y="16" width="168" height="168" rx="42" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Inner Dark Console Plate -->
  <rect x="24" y="24" width="152" height="152" rx="36" fill="#0F172A" />

  <!-- Globe Longitude/Latitude Grid Lines -->
  <g stroke="#334155" stroke-width="2.5" fill="none" opacity="0.65">
    <circle cx="100" cy="100" r="54" />
    <ellipse cx="100" cy="100" rx="27" ry="54" />
    <line x1="46" y1="100" x2="154" y2="100" />
    <line x1="56" y1="76" x2="144" y2="76" stroke-dasharray="4,4" />
    <line x1="56" y1="124" x2="144" y2="124" stroke-dasharray="4,4" />
  </g>

  <!-- Central Tech Terminal Brackets < / > -->
  <g stroke="url(#glowGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Bracket < -->
    <polyline points="80,78 62,100 80,122" />
    <!-- Center Slash / -->
    <line x1="107" y1="74" x2="93" y2="126" stroke="#38BDF8" stroke-width="6.5" />
    <!-- Right Bracket > -->
    <polyline points="120,78 138,100 120,122" />
  </g>

  <!-- Small Glowing Pulse Nodes -->
  <circle cx="100" cy="46" r="4.5" fill="#38BDF8" />
  <circle cx="100" cy="154" r="4.5" fill="#10B981" />
  <circle cx="46" cy="100" r="4.5" fill="#818CF8" />
  <circle cx="154" cy="100" r="4.5" fill="#34D399" />
</svg>